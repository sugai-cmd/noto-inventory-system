<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ダッシュボード | NOTO Naorai</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main>
  <div id="messages"></div>
  <div id="alerts"></div>

  <div class="stat-row" style="margin-bottom:20px">
    <div class="stat">
      <div class="label">未着手の受注</div>
      <div class="value" id="statPending">-</div>
    </div>
    <div class="stat">
      <div class="label">蒸留中</div>
      <div class="value" id="statDistilling">-</div>
    </div>
    <div class="stat">
      <div class="label">要発注の資材</div>
      <div class="value" id="statShortage">-</div>
    </div>
    <div class="stat">
      <div class="label">商品在庫合計 <span class="unit">本</span></div>
      <div class="value" id="statStock">-</div>
    </div>
  </div>

  <section class="panel" id="salesPanel">
    <h2>売上進捗</h2>
    <div class="grid">
      <div>
        <label for="spMonth">対象月</label>
        <input type="month" id="spMonth">
      </div>
      <div>
        <label for="spBasis">実績を数える日付</label>
        <select id="spBasis">
          <option value="delivered">納品日</option>
          <option value="ordered">受注日</option>
          <option value="payment_due">入金予定日</option>
        </select>
      </div>
    </div>
    <p class="muted" id="spBasisNote" style="font-size:13px"></p>
    <div id="salesProgress"></div>
  </section>

  <section class="panel">
    <h2>未着手の受注</h2>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>受注番号</th><th>受注日</th><th>得意先</th><th>商品</th><th class="num">本数</th><th class="num">合計</th><th>納入希望日</th></tr>
        </thead>
        <tbody id="pendingRows"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>本日の出荷予定</h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>受注番号</th><th>得意先</th><th>商品</th><th class="num">本数</th><th>配送方法</th><th>届け先</th></tr></thead>
        <tbody id="shipmentsDueRows"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>入金予定日を過ぎている受注</h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>受注番号</th><th>得意先</th><th>商品</th><th class="num">金額</th><th>入金予定日</th><th class="num">超過</th></tr></thead>
        <tbody id="unpaidRows"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>次回注文の予測</h2>
    <p class="muted" style="margin-top:0;font-size:13px">
      直近の注文間隔の平均から見込んだ日付です。間隔のばらつきが大きい得意先は確度「低」と出るので、
      催促の判断はそちらも見てください。
    </p>
    <div class="table-scroll">
      <table>
        <thead><tr><th>得意先</th><th>前回の注文</th><th class="num">平均間隔</th><th>次回予測</th><th>確度</th><th class="num">回数</th></tr></thead>
        <tbody id="forecastRows"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>在庫が少ない商品</h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>商品名称</th><th class="num">商品</th><th class="num">仕掛品</th></tr></thead>
        <tbody id="lowStockRows"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>要発注の資材</h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>資材名</th><th class="num">現在庫</th><th class="num">適正在庫</th><th>発注先</th><th class="num">リードタイム</th></tr></thead>
        <tbody id="shortageRows"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="assets/js/app.js"></script>
<script>
renderNav('index.html');

const LOW_STOCK_THRESHOLD = 20;

(async () => {
  try {
    // 1つの取得が失敗しても、取れたものは表示する。
    // 全部まとめて落とすと、画面が「-」だらけになって原因も分からなくなるため。
    const sources = [
      ['orders', '/api/orders?status=' + encodeURIComponent('未着手'), []],
      ['products', '/api/products/stock', []],
      ['materials', '/api/materials/stock', []],
      ['distillations', '/api/distillations?status=' + encodeURIComponent('蒸留中'), []],
      ['staleDistillations', '/api/distillations/alerts', []],
      ['progress', '/api/sales-targets/progress', { targetAmount: null, targetMonth: '' }],
      ['shipmentsDue', '/api/dashboard/shipments-due', []],
      ['unpaid', '/api/dashboard/unpaid', []],
      ['forecast', '/api/dashboard/order-forecast', []],
      ['staleLots', '/api/wip-lots/stale', []],
    ];

    const settled = await Promise.allSettled(sources.map(([, path]) => apiGet(path)));
    const data = {};
    const failures = [];
    settled.forEach((result, i) => {
      const [key, , fallback] = sources[i];
      if (result.status === 'fulfilled') {
        data[key] = result.value;
      } else {
        data[key] = fallback;
        failures.push(result.reason.message);
      }
    });
    const { orders, products, materials, distillations, staleDistillations, progress,
            shipmentsDue, unpaid, forecast, staleLots } = data;

    if (failures.length) {
      showMessage('messages', 'error', [...new Set(failures)].join(' / '));
    }

    const shortages = materials.filter((m) => m.shortage);

    el('statPending').textContent = orders.length;
    el('statDistilling').textContent = distillations.length;
    el('statShortage').textContent = shortages.length;
    el('statStock').textContent = num(
      products.reduce((sum, p) => sum + (p.product_stock ?? 0), 0)
    );

    const alertBlocks = [];
    if (staleDistillations.length) {
      alertBlocks.push(`<div class="msg error">
        <strong>24時間以上「蒸留中」のままの蒸留が ${staleDistillations.length} 件あります</strong>
        <ul>${staleDistillations.map((d) =>
          `<li>${escapeHtml(d.distillation_code)}（開始 ${escapeHtml(d.started_on)} ${escapeHtml(d.started_time)}・経過 ${d.elapsed_hours}時間）</li>`
        ).join('')}</ul>
        <p style="margin:6px 0 0"><a href="distillation.html">蒸留画面で確認する</a></p>
      </div>`);
    }
    if (staleLots.length) {
      alertBlocks.push(`<div class="msg error">
        <strong>瓶詰めから7日以上たっている仕掛品が ${staleLots.length} 件あります</strong>
        <ul>${staleLots.slice(0, 10).map((l) =>
          `<li>${escapeHtml(l.history_code)}／${escapeHtml(l.product_name)} 残${num(l.remaining)}本（瓶詰め ${escapeHtml(l.txn_date)}・${l.elapsed_days}日経過）</li>`
        ).join('')}</ul>
        <p style="margin:6px 0 0"><a href="bottling.html">箱詰め画面へ</a></p>
      </div>`);
    }
    if (unpaid.length) {
      alertBlocks.push(`<div class="msg error">
        <strong>入金予定日を過ぎて未入金の受注が ${unpaid.length} 件あります</strong>
      </div>`);
    }
    el('alerts').innerHTML = alertBlocks.join('');

    // 売上目標に対する進捗
    el('spMonth').value = progress.targetMonth;
    el('spBasis').value = progress.basis;
    renderSalesProgress(progress);

    el('pendingRows').innerHTML = orders.length
      ? orders.slice(0, 20).map((o) => `<tr>
          <td>${escapeHtml(o.order_no)}</td>
          <td>${escapeHtml(o.ordered_on)}</td>
          <td>${escapeHtml(o.customer_name)}</td>
          <td>${escapeHtml(o.product_name)}</td>
          <td class="num">${num(o.quantity)}</td>
          <td class="num">${yen(o.total_amount)}</td>
          <td>${escapeHtml(o.requested_delivery_on ?? '')}</td>
        </tr>`).join('')
      : '<tr><td colspan="7" class="empty">未着手の受注はありません</td></tr>';

    el('shipmentsDueRows').innerHTML = shipmentsDue.length
      ? shipmentsDue.map((o) => `<tr>
          <td>${escapeHtml(o.order_no)}${o.line_no > 1 ? `-${o.line_no}` : ''}</td>
          <td>${escapeHtml(o.customer_name)}</td>
          <td>${escapeHtml(o.product_name)}</td>
          <td class="num">${num(o.quantity)}</td>
          <td>${escapeHtml(o.delivery_method ?? '')}</td>
          <td>${escapeHtml(o.delivery_address ?? '')}</td>
        </tr>`).join('')
      : '<tr><td colspan="6" class="empty">本日の出荷予定はありません</td></tr>';

    el('unpaidRows').innerHTML = unpaid.length
      ? unpaid.map((o) => `<tr>
          <td>${escapeHtml(o.order_no)}${o.line_no > 1 ? `-${o.line_no}` : ''}</td>
          <td>${escapeHtml(o.customer_name)}</td>
          <td>${escapeHtml(o.product_name)}</td>
          <td class="num">${yen(o.total_amount)}</td>
          <td>${escapeHtml(o.payment_due_on)}</td>
          <td class="num">${o.overdue_days}日</td>
        </tr>`).join('')
      : '<tr><td colspan="6" class="empty">期日を過ぎた未入金はありません</td></tr>';

    const CONFIDENCE_BADGE = { 高: 'ok', 中: 'warn', 低: 'muted' };
    el('forecastRows').innerHTML = forecast.length
      ? forecast.map((f) => `<tr>
          <td>${escapeHtml(f.customerName)}</td>
          <td>${escapeHtml(f.lastOrderedOn)}</td>
          <td class="num">${f.averageIntervalDays}日</td>
          <td>${escapeHtml(f.predictedNextOn)}</td>
          <td><span class="badge ${CONFIDENCE_BADGE[f.confidence]}">${escapeHtml(f.confidence)}</span></td>
          <td class="num">${f.orderCount}</td>
        </tr>`).join('')
      : '<tr><td colspan="6" class="empty">予測できる得意先がまだありません（3回以上の注文が必要です）</td></tr>';

    const lowStock = products.filter((p) => (p.product_stock ?? 0) <= LOW_STOCK_THRESHOLD);
    el('lowStockRows').innerHTML = lowStock.length
      ? lowStock.map((p) => `<tr>
          <td>${escapeHtml(p.name)}</td>
          <td class="num">${num(p.product_stock)}</td>
          <td class="num">${num(p.wip_stock)}</td>
        </tr>`).join('')
      : `<tr><td colspan="3" class="empty">在庫${LOW_STOCK_THRESHOLD}本以下の商品はありません</td></tr>`;

    el('shortageRows').innerHTML = shortages.length
      ? shortages.map((m) => `<tr>
          <td>${escapeHtml(m.name)}</td>
          <td class="num">${num(m.current_stock, 2)}</td>
          <td class="num">${num(m.proper_stock_qty)}</td>
          <td>${escapeHtml(m.supplier_name ?? '')}</td>
          <td class="num">${m.lead_time_days != null ? `${m.lead_time_days}日` : ''}</td>
        </tr>`).join('')
      : '<tr><td colspan="5" class="empty">適正在庫を下回っている資材はありません</td></tr>';
  } catch (err) {
    showMessage('messages', 'error', err.message);
  }
})();

/**
 * 売上進捗。実績がどの日付で数えられているかを画面に書き、
 * 内訳は折り畳みで開けるようにする。
 *
 * 「実績 ¥365,790（11件）」としか出ていなかったため、
 * どの日付基準なのかも、中身が何なのかも画面から分からなかった。
 */
function renderSalesProgress(progress) {
  const missing = progress.basis === 'delivered'
    ? '納品日が未入力の受注は入りません。'
    : progress.basis === 'payment_due'
      ? '入金予定日が未入力の受注は入りません。'
      : '';
  el('spBasisNote').innerHTML =
    `実績は<strong>${escapeHtml(progress.basisLabel)}</strong>がこの月にあるものを数えています。` +
    `${escapeHtml(missing)}委託は基準にかかわらず<strong>報告月</strong>で数えます。`;

  if (progress.targetAmount == null) {
    el('salesProgress').innerHTML =
      `<p class="muted" style="margin:0;font-size:13px">
         ${escapeHtml(progress.targetMonth)} の売上目標が未設定です。
         <a href="sales-targets.html">売上目標を設定する</a>
       </p>` + breakdownHtml(progress);
    return;
  }

  el('salesProgress').innerHTML =
    `<div class="stat-row">
       <div class="stat"><div class="label">目標</div><div class="value">${yen(progress.targetAmount)}</div></div>
       <div class="stat"><div class="label">実績</div><div class="value">${yen(progress.actualAmount)}</div></div>
       <div class="stat"><div class="label">達成率</div><div class="value">${progress.progressRate}<span class="unit">%</span></div></div>
       <div class="stat"><div class="label">残り</div><div class="value">${yen(progress.remainingAmount)}</div></div>
     </div>` + breakdownHtml(progress);
}

/** 回収の状態。請求日・入金日から出している */
function statusBadge(status) {
  const cls = status === '入金済' ? 'ok' : status === '未入金' ? 'warn' : 'muted';
  return `<span class="badge ${cls}">${escapeHtml(status)}</span>`;
}

/** いま基準になっている日付の見出しに印を付ける */
function basisMark(progress, column) {
  return progress.basisColumn === column ? ' ●' : '';
}

function breakdownHtml(progress) {
  const { purchase, consignment } = progress.breakdown;

  const purchaseRows = purchase.rows.length
    ? purchase.rows.map((r) => `<tr>
        <td>${escapeHtml(r.order_no)}</td>
        <td>${escapeHtml(r.ordered_on ?? '')}</td>
        <td>${escapeHtml(r.delivered_on ?? '')}</td>
        <td>${escapeHtml(r.customer_name)}</td>
        <td>${escapeHtml(r.product_name)}</td>
        <td class="num">${num(r.quantity)}</td>
        <td class="num">${yen(r.sales_amount)}</td>
        <td>${escapeHtml(r.invoiced_on ?? '')}</td>
        <td>${escapeHtml(r.paid_on ?? '')}</td>
        <td>${statusBadge(r.payment_status)}</td>
      </tr>`).join('')
    : '<tr><td colspan="10" class="empty">この月に数えた受注はありません</td></tr>';

  const consignmentRows = consignment.rows.length
    ? consignment.rows.map((r) => `<tr>
        <td>${escapeHtml(r.report_no ?? '')}</td>
        <td>${escapeHtml(r.report_month)}</td>
        <td>${escapeHtml(r.customer_name)}</td>
        <td>${escapeHtml(r.product_name)}</td>
        <td class="num">${num(r.quantity)}</td>
        <td class="num">${yen(r.sales_amount)}</td>
        <td>${escapeHtml(r.invoiced_on ?? '')}</td>
        <td>${escapeHtml(r.paid_on ?? '')}</td>
        <td>${statusBadge(r.payment_status)}</td>
      </tr>`).join('')
    : '<tr><td colspan="9" class="empty">この月の委託の報告はありません</td></tr>';

  return `
    <details id="spBreakdown" style="margin-top:12px">
      <summary style="cursor:pointer">
        内訳: 買取 ${yen(purchase.amount)}（${purchase.count}件） /
        委託 ${yen(consignment.amount)}（${consignment.count}件）
      </summary>

      <h3 style="margin-bottom:4px">買取</h3>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>受注番号</th>
            <th>受注日${basisMark(progress, 'ordered_on')}</th>
            <th>納品日${basisMark(progress, 'delivered_on')}</th>
            <th>得意先</th><th>商品</th><th class="num">本数</th><th class="num">金額</th>
            <th>請求日</th><th>入金日</th><th>状態</th>
          </tr></thead>
          <tbody id="spPurchaseRows">${purchaseRows}</tbody>
        </table>
      </div>

      <h3 style="margin-bottom:4px">委託（報告月で計上）</h3>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>報告番号</th><th>報告月</th><th>得意先</th><th>商品</th>
            <th class="num">本数</th><th class="num">金額</th>
            <th>請求日</th><th>入金日</th><th>状態</th>
          </tr></thead>
          <tbody id="spConsignmentRows">${consignmentRows}</tbody>
        </table>
      </div>
    </details>`;
}

/** 月や基準を変えたら、この欄だけ取り直す */
async function reloadSalesProgress() {
  const open = el('spBreakdown')?.open ?? false;
  const params = new URLSearchParams({ basis: el('spBasis').value });
  if (el('spMonth').value) params.set('month', el('spMonth').value);
  try {
    const progress = await apiGet(`/api/sales-targets/progress?${params}`);
    renderSalesProgress(progress);
    // 開いたまま月を切り替えても閉じないようにする
    if (open && el('spBreakdown')) el('spBreakdown').open = true;
  } catch (err) {
    showMessage('messages', 'error', err.message, err.details);
  }
}

el('spMonth').addEventListener('change', reloadSalesProgress);
el('spBasis').addEventListener('change', reloadSalesProgress);
</script>
</body>
</html>
