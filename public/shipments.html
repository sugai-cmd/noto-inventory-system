<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>返品・無償出荷・委託 | NOTO Naorai</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main>
  <div id="messages"></div>

  <section class="panel">
    <h2>返品</h2>
    <p class="muted" style="margin-top:0;font-size:13px">
      得意先から戻ってきた商品を在庫に戻します。受注を指定すると、どの出荷に対する返品か追えます。
    </p>
    <form id="returnForm">
      <div class="grid">
        <div>
          <label for="retProductSearch">商品</label>
          <div class="search-wrap">
            <input type="text" id="retProductSearch" placeholder="商品名で検索" autocomplete="off">
            <div class="search-results" id="retProductResults"></div>
          </div>
          <div class="chosen" id="retProductChosen">
            <span class="name"></span><button type="button" class="secondary small">変更</button>
          </div>
        </div>
        <div>
          <label for="retCustomerSearch">得意先</label>
          <div class="search-wrap">
            <input type="text" id="retCustomerSearch" placeholder="得意先名で検索" autocomplete="off">
            <div class="search-results" id="retCustomerResults"></div>
          </div>
          <div class="chosen" id="retCustomerChosen">
            <span class="name"></span><button type="button" class="secondary small">変更</button>
          </div>
        </div>
        <div><label for="retQuantity">返品本数</label><input type="number" id="retQuantity" min="1" step="1" required></div>
        <div><label for="retDate">返品日</label><input type="date" id="retDate" required></div>
        <div><label for="retReason">理由</label><input type="text" id="retReason" placeholder="破損・売れ残り など"></div>
      </div>
      <div class="actions"><button type="submit" id="retSubmit">返品を登録</button></div>
    </form>
  </section>

  <section class="panel">
    <h2>無償出荷（サンプル・再発送など）</h2>
    <p class="muted" style="margin-top:0;font-size:13px">
      代金をもらわずに出した分を記録します。IDが採番され、在庫からも引かれます。<br>
      <strong>売上は立ちませんが、酒税はかかります</strong>（無償でも製造場からの移出は課税されます）。
      区分は、あとから一覧の行で直せます。
    </p>
    <form id="sampleForm">
      <div class="grid">
        <div>
          <label for="smpProductSearch">商品</label>
          <div class="search-wrap">
            <input type="text" id="smpProductSearch" placeholder="商品名で検索" autocomplete="off">
            <div class="search-results" id="smpProductResults"></div>
          </div>
          <div class="chosen" id="smpProductChosen">
            <span class="name"></span><button type="button" class="secondary small">変更</button>
          </div>
        </div>
        <div>
          <label for="smpCustomerSearch">送付先</label>
          <div class="search-wrap">
            <input type="text" id="smpCustomerSearch" placeholder="得意先名で検索" autocomplete="off">
            <div class="search-results" id="smpCustomerResults"></div>
          </div>
          <div class="chosen" id="smpCustomerChosen">
            <span class="name"></span><button type="button" class="secondary small">変更</button>
          </div>
        </div>
        <div>
          <label for="smpPurpose">区分</label>
          <select id="smpPurpose" required></select>
        </div>
        <div><label for="smpQuantity">本数</label><input type="number" id="smpQuantity" min="1" step="1" required></div>
        <div><label for="smpContact">先方担当者名</label><input type="text" id="smpContact"></div>
        <div><label for="smpPhone">電話番号</label><input type="text" id="smpPhone"></div>
        <div><label for="smpDate">発送日</label><input type="date" id="smpDate" required></div>
        <div><label for="smpFollowup">後追い連絡日</label><input type="date" id="smpFollowup"></div>
      </div>
      <div style="margin-top:12px"><label for="smpNote">備考</label><input type="text" id="smpNote"></div>
      <div class="actions"><button type="submit" id="smpSubmit">無償出荷を登録</button></div>
    </form>
    <h3>無償出荷の履歴</h3>

    <div class="grid" style="margin-bottom:12px">
      <div>
        <label for="smpFCustomer">送付先</label>
        <input type="text" id="smpFCustomer" placeholder="得意先名・備考の送付先">
      </div>
      <div>
        <label for="smpFContact">担当者</label>
        <input type="text" id="smpFContact" placeholder="先方担当者名">
      </div>
      <div>
        <label for="smpFPurpose">区分</label>
        <select id="smpFPurpose"><option value="">すべて</option></select>
      </div>
      <div>
        <label for="smpFFrom">発送日（から）</label>
        <input type="date" id="smpFFrom">
      </div>
      <div>
        <label for="smpFTo">発送日（まで）</label>
        <input type="date" id="smpFTo">
      </div>
      <div>
        <label for="smpLimit">1ページの件数</label>
        <select id="smpLimit">
          <option value="10">10</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
      </div>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th><button type="button" class="link" data-sort="sample_no">ID</button></th>
            <th>区分</th>
            <th><button type="button" class="link" data-sort="shipped_on">発送日</button></th>
            <th><button type="button" class="link" data-sort="customer_name">送付先</button></th>
            <th><button type="button" class="link" data-sort="contact_name">担当者</button></th>
            <th><button type="button" class="link" data-sort="product_name">商品</button></th>
            <th class="num"><button type="button" class="link" data-sort="quantity">本数</button></th>
            <th>備考</th>
          </tr>
        </thead>
        <tbody id="sampleRows"></tbody>
      </table>
    </div>

    <div class="actions">
      <button type="button" id="smpPrev">前へ</button>
      <button type="button" id="smpNext">次へ</button>
      <span id="smpRange" class="hint"></span>
    </div>
  </section>

  <section class="panel">
    <h2>委託販売実績報告</h2>
    <p class="muted" style="margin-top:0;font-size:13px">
      委託で預けた分のうち、その月に実際に売れた本数を報告します。入金予定日は報告月の月末になります。
    </p>
    <form id="consignmentForm">
      <div class="grid">
        <div>
          <label for="conOrder">対象の委託受注</label>
          <select id="conOrder" required></select>
          <div class="hint" id="conHint"></div>
        </div>
        <div><label for="conMonth">対象月</label><input type="month" id="conMonth" required></div>
        <div><label for="conQuantity">実売本数</label><input type="number" id="conQuantity" min="1" step="1" required></div>
      </div>
      <div style="margin-top:12px"><label for="conNote">備考</label><input type="text" id="conNote"></div>
      <div class="actions"><button type="submit" id="conSubmit">実績を報告</button></div>
    </form>
    <h3>報告済み一覧</h3>
    <div class="table-scroll">
      <table>
        <thead><tr><th>対象月</th><th>受注番号</th><th>得意先</th><th>商品</th><th class="num">本数</th><th class="num">売価</th><th>入金予定日</th></tr></thead>
        <tbody id="consignmentRows"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="assets/js/app.js"></script>
<script>
renderNav('shipments.html');

const retProduct = createSearchSelect({
  inputId: 'retProductSearch', resultsId: 'retProductResults', chosenId: 'retProductChosen',
  endpoint: '/api/products/search', renderLabel: (p) => p.name,
  renderSub: (p) => `在庫 ${p.product_stock ?? 0}本`,
});
const retCustomer = createSearchSelect({
  inputId: 'retCustomerSearch', resultsId: 'retCustomerResults', chosenId: 'retCustomerChosen',
  endpoint: '/api/customers/search', renderLabel: (c) => c.name,
});
const smpProduct = createSearchSelect({
  inputId: 'smpProductSearch', resultsId: 'smpProductResults', chosenId: 'smpProductChosen',
  endpoint: '/api/products/search', renderLabel: (p) => p.name,
  renderSub: (p) => `在庫 ${p.product_stock ?? 0}本`,
});
const smpCustomer = createSearchSelect({
  inputId: 'smpCustomerSearch', resultsId: 'smpCustomerResults', chosenId: 'smpCustomerChosen',
  endpoint: '/api/customers/search', renderLabel: (c) => c.name,
});

el('returnForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMessage('messages');
  if (!retProduct.value) return showMessage('messages', 'error', '商品を選択してください');

  const payload = {
    productId: retProduct.value.id,
    quantity: Number(el('retQuantity').value),
    txnDate: el('retDate').value,
  };
  if (retCustomer.value) payload.customerId = retCustomer.value.id;
  if (el('retReason').value.trim()) payload.reason = el('retReason').value.trim();

  el('retSubmit').disabled = true;
  try {
    const r = await apiPost('/api/shipments/returns', payload);
    showMessage('messages', 'ok',
      `${r.product.name} の返品を登録しました（在庫 ${r.after.product_stock}本）`);
    el('returnForm').reset();
    el('retDate').value = todayStr();
    retProduct.reset(); retCustomer.reset();
  } catch (err) {
    showMessage('messages', 'error', err.message, err.details);
  } finally {
    el('retSubmit').disabled = false;
  }
});

// 区分の一覧は shipmentService が持つ。**画面に書き写さない**
// （増やしたときに画面だけ古いままになる）
let shipmentPurposes = [];
let defaultPurpose = '';

async function loadPurposes() {
  const r = await apiGet('/api/shipments/samples/purposes');
  shipmentPurposes = r.purposes;
  defaultPurpose = r.default;

  const options = shipmentPurposes
    .map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
  el('smpPurpose').innerHTML = options;
  el('smpPurpose').value = defaultPurpose;
  el('smpFPurpose').innerHTML = '<option value="">すべて</option>' + options;
}

// 一覧の状態（並べ替え・ページ位置）。ヘルパは assets/js/app.js
const sampleView = createListView('shipped_on');
const SAMPLE_PAGER = { limit: 'smpLimit', prev: 'smpPrev', next: 'smpNext', range: 'smpRange' };

async function loadSamples() {
  const params = listQuery(sampleView, SAMPLE_PAGER);
  if (el('smpFCustomer').value.trim()) params.set('customer', el('smpFCustomer').value.trim());
  if (el('smpFContact').value.trim()) params.set('contact', el('smpFContact').value.trim());
  if (el('smpFPurpose').value) params.set('purpose', el('smpFPurpose').value);
  if (el('smpFFrom').value) params.set('from', el('smpFFrom').value);
  if (el('smpFTo').value) params.set('to', el('smpFTo').value);

  const { rows, total } = asListResult(
    await apiGet(`/api/shipments/samples?${params}`), '無償出荷の履歴');
  sampleView.total = total;

  el('sampleRows').innerHTML = rows.length
    ? rows.map((s) => `<tr>
        <td>${escapeHtml(s.sample_no)}</td>
        <td>
          <select class="purpose-edit" data-id="${s.id}" aria-label="${escapeHtml(s.sample_no)} の区分">
            ${shipmentPurposes.map((p) =>
              `<option value="${escapeHtml(p)}"${p === s.purpose ? ' selected' : ''}>${escapeHtml(p)}</option>`
            ).join('')}
          </select>
        </td>
        <td>${escapeHtml(s.shipped_on)}</td>
        <td>${escapeHtml(s.customer_name ?? '')}</td>
        <td>${escapeHtml(s.contact_name ?? '')}</td>
        <td>${s.product_name ? escapeHtml(s.product_name) : '<span class="muted">（販促資料のみ）</span>'}</td>
        <td class="num">${s.quantity != null ? num(s.quantity) : ''}</td>
        <td>${escapeHtml(s.note ?? '')}</td>
      </tr>`).join('')
    : '<tr><td colspan="8" class="empty">該当する無償出荷がありません</td></tr>';

  // 区分だけをその場で直す。数量・商品・日付は送れない（在庫と酒税が動くため）
  for (const select of el('sampleRows').querySelectorAll('.purpose-edit')) {
    select.addEventListener('change', async () => {
      clearMessage('messages');
      const before = select.dataset.before ?? select.value;
      select.disabled = true;
      try {
        const r = await apiPatch(`/api/shipments/samples/${select.dataset.id}`,
          { purpose: select.value });
        await loadSamples();
        showMessage('messages', 'ok',
          `${r.sampleNo} の区分を「${r.before}」から「${r.purpose}」に直しました`);
      } catch (err) {
        select.value = before;
        showMessage('messages', 'error', err.message, err.details);
      } finally {
        select.disabled = false;
      }
    });
    select.dataset.before = select.value;
  }

  renderSortMarks(sampleView, el('sampleRows').closest('table'));
  renderPager(sampleView, SAMPLE_PAGER, rows.length);
}

const reloadSamples = () =>
  loadSamples().catch((err) => showMessage('messages', 'error', err.message, err.details));

// 絞り込みを変えたら1ページ目に戻す。文字の欄は change（入力のたびに投げない）
wirePager(sampleView, SAMPLE_PAGER, reloadSamples,
  ['smpFCustomer', 'smpFContact', 'smpFPurpose', 'smpFFrom', 'smpFTo']);
wireSortHeaders(sampleView, 'sampleRows', reloadSamples);

el('sampleForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMessage('messages');
  if (!smpProduct.value) return showMessage('messages', 'error', '商品を選択してください');

  const payload = {
    productId: smpProduct.value.id,
    quantity: Number(el('smpQuantity').value),
    shippedOn: el('smpDate').value,
    purpose: el('smpPurpose').value,
  };
  if (smpCustomer.value) payload.customerId = smpCustomer.value.id;
  for (const [id, key] of [['smpContact','contactName'],['smpPhone','phone'],['smpNote','note']]) {
    if (el(id).value.trim()) payload[key] = el(id).value.trim();
  }
  if (el('smpFollowup').value) payload.followupOn = el('smpFollowup').value;

  el('smpSubmit').disabled = true;
  try {
    const r = await apiPost('/api/shipments/samples', payload);
    showMessage('messages', 'ok',
      `無償出荷 ${r.sampleNo}（${r.purpose}）を登録しました` +
      `（在庫 ${r.after.product_stock}本／酒税タブのその月に乗ります。売上は立ちません）`);
    el('sampleForm').reset();
    el('smpDate').value = todayStr();
    // reset() で区分が空になるので既定に戻す
    el('smpPurpose').value = defaultPurpose;
    smpProduct.reset(); smpCustomer.reset();
    await loadSamples();
  } catch (err) {
    showMessage('messages', 'error', err.message, err.details);
  } finally {
    el('smpSubmit').disabled = false;
  }
});

let pendingOrders = [];

async function loadConsignment() {
  pendingOrders = await apiGet('/api/shipments/consignment/pending');
  el('conOrder').innerHTML = '<option value="">選択してください</option>' +
    pendingOrders.map((o) =>
      `<option value="${o.id}">${escapeHtml(o.order_no)} ${escapeHtml(o.customer_name)} / ${escapeHtml(o.product_name)}（残 ${o.remaining_quantity}本）</option>`
    ).join('');

  const reports = await apiGet('/api/shipments/consignment');
  el('consignmentRows').innerHTML = reports.length
    ? reports.map((r) => `<tr>
        <td>${escapeHtml(r.report_month)}</td>
        <td>${escapeHtml(r.order_no)}</td>
        <td>${escapeHtml(r.customer_name)}</td>
        <td>${escapeHtml(r.product_name)}</td>
        <td class="num">${num(r.quantity)}</td>
        <td class="num">${yen(r.sales_amount)}</td>
        <td>${escapeHtml(r.payment_due_on ?? '')}</td>
      </tr>`).join('')
    : '<tr><td colspan="7" class="empty">報告済みの実績がありません</td></tr>';
}

el('conOrder').addEventListener('change', () => {
  const order = pendingOrders.find((o) => String(o.id) === el('conOrder').value);
  el('conHint').textContent = order
    ? `受注 ${order.quantity}本 / 報告済 ${order.reported_quantity}本 / 残り ${order.remaining_quantity}本`
    : '';
});

el('consignmentForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMessage('messages');

  const payload = {
    orderId: Number(el('conOrder').value),
    reportMonth: el('conMonth').value,
    quantity: Number(el('conQuantity').value),
  };
  if (el('conNote').value.trim()) payload.note = el('conNote').value.trim();

  el('conSubmit').disabled = true;
  try {
    const r = await apiPost('/api/shipments/consignment', payload);
    showMessage('messages', 'ok',
      `${r.order_no} の ${r.report_month} 分を報告しました（${r.quantity}本 / 入金予定 ${r.payment_due_on}）`);
    el('consignmentForm').reset();
    el('conHint').textContent = '';
    await loadConsignment();
  } catch (err) {
    showMessage('messages', 'error', err.message, err.details);
  } finally {
    el('conSubmit').disabled = false;
  }
});

el('retDate').value = todayStr();
el('smpDate').value = todayStr();
el('conMonth').value = todayStr().slice(0, 7);
// 区分の選択肢は一覧の行でも使うので、**一覧より先に**読む
Promise.all([loadPurposes().then(loadSamples), loadConsignment()])
  .catch((err) => showMessage('messages', 'error', err.message));
</script>
</body>
</html>
