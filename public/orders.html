<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>受注 | NOTO Naorai</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main>
  <div id="messages"></div>

  <section class="panel">
    <h2>受注登録</h2>
    <form id="orderForm">
      <div class="grid">
        <div>
          <label for="customerSearch">得意先</label>
          <div class="search-wrap">
            <input type="text" id="customerSearch" placeholder="得意先名で検索（入力すると候補が出ます）" autocomplete="off">
            <div class="search-results" id="customerResults"></div>
          </div>
          <div class="chosen" id="customerChosen">
            <span class="name"></span>
            <button type="button" class="secondary small">変更</button>
          </div>
        </div>

        <div>
          <label for="productSearch">商品</label>
          <div class="search-wrap">
            <input type="text" id="productSearch" placeholder="商品名で検索" autocomplete="off">
            <div class="search-results" id="productResults"></div>
          </div>
          <div class="chosen" id="productChosen">
            <span class="name"></span>
            <button type="button" class="secondary small">変更</button>
          </div>
          <div class="hint" id="productStockHint"></div>
        </div>

        <div>
          <label for="orderedOn">受注日</label>
          <input type="date" id="orderedOn" required>
        </div>

        <div>
          <label for="quantity">本数</label>
          <input type="number" id="quantity" min="1" step="1" value="1" required>
          <div class="hint">
            複数商品の受注は「明細に追加」を押して並べてください（同じ受注番号の複数行になります）
          </div>
        </div>

        <div>
          <label for="unitPrice">単価（商品マスタの上代）</label>
          <input type="number" id="unitPrice" readonly>
        </div>

        <div>
          <label for="markupRate">掛け率（得意先マスタ）</label>
          <input type="number" id="markupRate" step="0.01" readonly>
        </div>

        <div>
          <label for="salesAmount">売価（単価×本数×掛け率）</label>
          <input type="number" id="salesAmount" readonly>
        </div>

        <div>
          <label for="shippingFee">送料</label>
          <input type="number" id="shippingFee" min="0" step="1" value="0">
          <div class="actions" style="margin-top:6px">
            <button type="button" class="secondary small" id="quoteBtn">送料を計算</button>
          </div>
          <div class="hint" id="shippingHint"></div>
          <div id="cartonPickWrap" style="display:none;margin-top:6px">
            <select id="cartonPick"></select>
            <div class="actions" style="margin-top:6px">
              <button type="button" class="secondary small" id="cartonApplyBtn">この段ボールで計算</button>
              <button type="button" class="secondary small" id="cartonSaveBtn">対応表に追加</button>
            </div>
          </div>
        </div>

        <div>
          <label for="totalAmount">合計（税込）</label>
          <input type="number" id="totalAmount" readonly>
        </div>

        <div>
          <label for="requestedDeliveryOn">納入希望日</label>
          <input type="date" id="requestedDeliveryOn">
        </div>

        <div>
          <label for="paymentDueOn">入金予定日（支払いサイトから自動計算）</label>
          <input type="date" id="paymentDueOn">
          <div class="hint" id="paymentHint"></div>
        </div>

        <div>
          <label for="invoicedOn">請求日</label>
          <input type="date" id="invoicedOn">
          <div class="hint" id="invoiceHint"></div>
        </div>

        <div>
          <label for="salesMethod">販売方法</label>
          <select id="salesMethod">
            <option value="買取">買取</option>
            <option value="委託">委託</option>
          </select>
        </div>

        <div>
          <label for="deliveryMethod">納品方法</label>
          <select id="deliveryMethod">
            <option value="配送">配送</option>
            <option value="手渡し">手渡し</option>
          </select>
        </div>

        <div>
          <label for="deliveryAddress">配送先</label>
          <input type="text" id="deliveryAddress" placeholder="住所・メモ">
        </div>
      </div>

      <div class="actions">
        <button type="button" class="secondary" id="addItemBtn">明細に追加</button>
      </div>

      <div class="table-scroll" id="itemsWrap" style="display:none;margin-top:12px">
        <table>
          <thead><tr><th>商品</th><th class="num">本数</th><th class="num">単価</th><th class="num">売価</th><th></th></tr></thead>
          <tbody id="itemRows"></tbody>
        </table>
      </div>

      <div style="margin-top:12px">
        <label for="note">備考</label>
        <textarea id="note" rows="2"></textarea>
      </div>

      <div class="actions">
        <button type="submit" id="submitBtn">受注を登録</button>
        <button type="button" class="secondary" id="resetBtn">クリア</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>受注一覧</h2>
    <div class="grid" style="margin-bottom:12px">
      <div>
        <label for="filterStatus">ステータス</label>
        <select id="filterStatus">
          <option value="">すべて</option>
          <option value="未着手">未着手</option>
          <option value="発送済">発送済</option>
        </select>
      </div>
      <div>
        <label for="filterFrom">受注日（開始）</label>
        <input type="date" id="filterFrom">
      </div>
      <div>
        <label for="filterTo">受注日（終了）</label>
        <input type="date" id="filterTo">
      </div>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>受注番号</th><th>受注日</th><th>得意先</th><th>商品</th>
            <th class="num">本数</th><th class="num">合計</th>
            <th>ステータス</th><th>納品日</th><th>入金予定</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="orderRows"></tbody>
      </table>
    </div>
    <div class="actions">
      <button type="button" class="secondary" id="exportYupack">ゆうパックCSV（上の絞り込み条件で出力）</button>
      <button type="button" class="secondary" id="exportMf">マネーフォワードCSV</button>
    </div>
  </section>

  <section class="panel">
    <h2>請求日の一括記録</h2>
    <p class="muted" style="margin-top:0;font-size:13px">
      納品済みでまだ請求日が入っていない受注の一覧です。請求書を送ったものにチェックして記録します。
    </p>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="invoiceAll" style="width:auto"></th>
            <th>受注番号</th><th>納品日</th><th>得意先</th><th>商品</th>
            <th class="num">合計</th><th>請求日送付期日</th>
          </tr>
        </thead>
        <tbody id="invoiceRows"></tbody>
      </table>
    </div>
    <div class="actions">
      <label for="bulkInvoicedOn" style="margin:0">請求日</label>
      <input type="date" id="bulkInvoicedOn" style="width:auto">
      <button type="button" id="invoiceSubmit">選択した受注に請求日を記録</button>
    </div>
  </section>
</main>

<script src="assets/js/app.js"></script>
<script>
renderNav('orders.html');

let customerSelect, productSelect;

/** 得意先・商品・本数が揃ったら、サーバー側で初期値（売価・入金予定日）を計算して反映する */
async function refreshDefaults() {
  const customer = customerSelect.value;
  const product = productSelect.value;
  const quantity = Number(el('quantity').value);
  if (!customer || !product || !quantity) return;

  const params = new URLSearchParams({
    customerId: customer.id,
    productId: product.id,
    quantity: String(quantity),
  });
  const deliveredOn = el('requestedDeliveryOn').value;
  if (deliveredOn) params.set('deliveredOn', deliveredOn);

  const d = await apiGet(`/api/orders/defaults?${params}`);
  el('unitPrice').value = d.unitPrice ?? '';
  el('markupRate').value = d.markupRate ?? '';
  el('salesAmount').value = d.salesAmount ?? '';
  if (d.paymentDueOn) el('paymentDueOn').value = d.paymentDueOn;
  el('paymentHint').textContent = d.customer
    ? `支払いサイト: ${d.customer.payment_term_months ?? '-'}ヶ月後 ${d.customer.payment_term_day ?? '末日'}`
    : '';
  el('invoiceHint').textContent = d.invoiceDueNote ? `請求日送付期日: ${d.invoiceDueNote}` : '';
  recalcTotal();
}

function recalcTotal() {
  const sales = Number(el('salesAmount').value || 0);
  const shipping = Number(el('shippingFee').value || 0);
  el('totalAmount').value = sales + shipping;
}

async function loadOrders() {
  const params = new URLSearchParams();
  if (el('filterStatus').value) params.set('status', el('filterStatus').value);
  if (el('filterFrom').value) params.set('from', el('filterFrom').value);
  if (el('filterTo').value) params.set('to', el('filterTo').value);

  const orders = await apiGet(`/api/orders?${params}`);
  const tbody = el('orderRows');

  if (!orders.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty">該当する受注がありません</td></tr>';
    return;
  }

  tbody.innerHTML = orders
    .map((o) => {
      const badge = o.status === '発送済' ? 'ok' : 'warn';
      const shipBtn =
        o.status === '発送済'
          ? ''
          : `<button class="small" data-ship="${o.id}">発送済にする</button>`;
      return `<tr>
        <td>${escapeHtml(o.order_no)}</td>
        <td>${escapeHtml(o.ordered_on)}</td>
        <td>${escapeHtml(o.customer_name)}</td>
        <td>${escapeHtml(o.product_name)}</td>
        <td class="num">${num(o.quantity)}</td>
        <td class="num">${yen(o.total_amount)}</td>
        <td><span class="badge ${badge}">${escapeHtml(o.status)}</span></td>
        <td>${escapeHtml(o.delivered_on ?? '')}</td>
        <td>${escapeHtml(o.payment_due_on ?? '')}</td>
        <td class="row-actions">${shipBtn}</td>
      </tr>`;
    })
    .join('');
}

el('orderRows').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-ship]');
  if (!btn) return;
  if (!confirm('この受注を発送済にします。商品在庫から出荷分が引かれます。よろしいですか？')) return;

  btn.disabled = true;
  try {
    const result = await apiPost(`/api/orders/${btn.dataset.ship}/ship`, {
      deliveredOn: todayStr(),
    });
    showMessage('messages', 'ok',
      `${result.order.order_no} を発送済にしました（出荷履歴を作成、入金予定日: ${result.order.payment_due_on ?? '-'}）`);
    await loadOrders();
  } catch (err) {
    showMessage('messages', 'error', err.message);
    btn.disabled = false;
  }
});

el('orderForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearMessage('messages');

  if (!customerSelect.value) return showMessage('messages', 'error', '得意先を選択してください');

  const items = currentItems();
  if (!items.length) return showMessage('messages', 'error', '商品を選択してください');

  const payload = {
    orderedOn: el('orderedOn').value,
    customerId: customerSelect.value.id,
    items: items.map((i) => ({ productId: i.productId, quantity: i.quantity })),
    shippingFee: Number(el('shippingFee').value || 0),
    salesMethod: el('salesMethod').value,
    deliveryMethod: el('deliveryMethod').value,
  };
  for (const [key, id] of [
    ['requestedDeliveryOn', 'requestedDeliveryOn'],
    ['paymentDueOn', 'paymentDueOn'],
    ['invoicedOn', 'invoicedOn'],
    ['deliveryAddress', 'deliveryAddress'],
    ['note', 'note'],
  ]) {
    const value = el(id).value.trim();
    if (value) payload[key] = value;
  }

  el('submitBtn').disabled = true;
  try {
    const order = await apiPost('/api/orders', payload);
    const total = order.lines.reduce((sum, l) => sum + (l.total_amount ?? 0), 0);
    showMessage('messages', 'ok',
      `受注 ${order.order_no} を登録しました（${order.lines.length}明細・合計 ${yen(total)}）`);
    resetForm();
    await loadOrders();
  } catch (err) {
    showMessage('messages', 'error', err.message, err.details);
  } finally {
    el('submitBtn').disabled = false;
  }
});

function resetForm() {
  el('orderForm').reset();
  el('orderedOn').value = todayStr();
  el('quantity').value = 1;
  el('shippingFee').value = 0;
  customerSelect.reset();
  productSelect.reset();
  el('productStockHint').textContent = '';
  el('paymentHint').textContent = '';
  el('invoiceHint').textContent = '';
  items = [];
  renderItems();
  el('shippingHint').textContent = '';
  el('cartonPickWrap').style.display = 'none';
}

// --- 明細（1受注で複数商品＝同じ受注番号の複数行） --------------------------

let items = [];

/** 明細に積んだものがあればそれ、無ければ今フォームで選んでいる1件 */
function currentItems() {
  if (items.length) return items;
  if (!productSelect.value) return [];
  return [
    {
      productId: productSelect.value.id,
      productName: productSelect.value.name,
      quantity: Number(el('quantity').value),
      unitPrice: Number(el('unitPrice').value) || null,
      salesAmount: Number(el('salesAmount').value) || null,
    },
  ];
}

function renderItems() {
  el('itemsWrap').style.display = items.length ? '' : 'none';
  el('itemRows').innerHTML = items
    .map((item, i) => `<tr>
      <td>${escapeHtml(item.productName)}</td>
      <td class="num">${num(item.quantity)}</td>
      <td class="num">${yen(item.unitPrice)}</td>
      <td class="num">${yen(item.salesAmount)}</td>
      <td><button type="button" class="danger small" data-item-del="${i}">削除</button></td>
    </tr>`)
    .join('');
}

el('addItemBtn').addEventListener('click', () => {
  clearMessage('messages');
  if (!productSelect.value) return showMessage('messages', 'error', '商品を選択してください');
  const quantity = Number(el('quantity').value);
  if (!quantity || quantity < 1) return showMessage('messages', 'error', '本数を入力してください');

  items.push({
    productId: productSelect.value.id,
    productName: productSelect.value.name,
    quantity,
    unitPrice: Number(el('unitPrice').value) || null,
    salesAmount: Number(el('salesAmount').value) || null,
  });
  renderItems();
  productSelect.reset();
  el('quantity').value = 1;
  el('productStockHint').textContent = '';
});

el('itemRows').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-item-del]');
  if (!btn) return;
  items.splice(Number(btn.dataset.itemDel), 1);
  renderItems();
});

// --- 送料の自動計算 ----------------------------------------------------------

async function quoteShipping(cartonSize) {
  clearMessage('messages');
  const list = currentItems();
  if (!list.length) return showMessage('messages', 'error', '商品を選択してください');

  const address = el('deliveryAddress').value.trim() || customerSelect.value?.address || '';
  const payload = {
    address,
    items: list.map((i) => ({ productId: i.productId, quantity: i.quantity })),
  };
  if (cartonSize) payload.cartonSize = cartonSize;

  try {
    const q = await apiPost('/api/shipping/quote', payload);

    if (q.resolved) {
      el('shippingFee').value = q.fee;
      el('shippingHint').textContent =
        `${q.prefecture}（${q.zone}）× ${q.cartonSize} → ${yen(q.fee)}`;
      el('cartonPickWrap').style.display = 'none';
      recalcTotal();
      return;
    }

    el('shippingHint').textContent = q.reasons.join(' / ');
    // 段ボールさえ決まれば計算できる状態なら、その場で選べるようにする
    const canPick = q.zone && q.cartonOptions.length;
    el('cartonPickWrap').style.display = canPick ? '' : 'none';
    if (canPick) {
      el('cartonPick').innerHTML = q.cartonOptions
        .map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`)
        .join('');
    }
  } catch (err) {
    showMessage('messages', 'error', err.message, err.details);
  }
}

el('quoteBtn').addEventListener('click', () => quoteShipping());
el('cartonApplyBtn').addEventListener('click', () => quoteShipping(el('cartonPick').value));

el('cartonSaveBtn').addEventListener('click', async () => {
  clearMessage('messages');
  const list = currentItems();
  if (list.length !== 1) {
    return showMessage('messages', 'error',
      '対応表は「商品×本数」の1対1なので、明細が1件のときだけ追加できます');
  }
  try {
    await apiPost('/api/shipping/carton-rules', {
      productId: list[0].productId,
      quantity: list[0].quantity,
      cartonSize: el('cartonPick').value,
    });
    const saved = el('cartonPick').value;
    // 先に再計算する（quoteShippingが冒頭でメッセージを消すため、順番を逆にすると表示が消える）
    await quoteShipping();
    showMessage('messages', 'ok',
      `対応表に追加しました（${list[0].productName} ${list[0].quantity}本 → ${saved}）。次回から自動で決まります`);
  } catch (err) {
    showMessage('messages', 'error', err.message, err.details);
  }
});

/** 一覧の絞り込み条件をそのままCSV出力にも引き継ぐ */
function currentFilterParams() {
  const params = new URLSearchParams();
  if (el('filterStatus').value) params.set('status', el('filterStatus').value);
  if (el('filterFrom').value) params.set('from', el('filterFrom').value);
  if (el('filterTo').value) params.set('to', el('filterTo').value);
  return params;
}

el('exportYupack').addEventListener('click', () => {
  location.href = `/api/exports/yupack?${currentFilterParams()}`;
});
el('exportMf').addEventListener('click', () => {
  location.href = `/api/exports/moneyforward?${currentFilterParams()}`;
});

el('resetBtn').addEventListener('click', resetForm);
el('quantity').addEventListener('input', refreshDefaults);
el('requestedDeliveryOn').addEventListener('change', refreshDefaults);
el('shippingFee').addEventListener('input', recalcTotal);
for (const id of ['filterStatus', 'filterFrom', 'filterTo']) {
  el(id).addEventListener('change', loadOrders);
}

customerSelect = createSearchSelect({
  inputId: 'customerSearch',
  resultsId: 'customerResults',
  chosenId: 'customerChosen',
  endpoint: '/api/customers/search',
  renderLabel: (c) => c.name,
  renderSub: (c) => `掛率 ${c.markup_rate} / 支払 ${c.payment_term_months ?? '-'}ヶ月後${c.payment_term_day ?? ''}`,
  onSelect: () => refreshDefaults(),
});

productSelect = createSearchSelect({
  inputId: 'productSearch',
  resultsId: 'productResults',
  chosenId: 'productChosen',
  endpoint: '/api/products/search',
  renderLabel: (p) => p.name,
  renderSub: (p) => `上代 ${yen(p.list_price)} / 在庫 ${p.product_stock ?? 0}本`,
  onSelect: (p) => {
    // 在庫僅少アラート（DATA_STRUCTURE.md 4-3の読み取り先）
    if (p) {
      const stock = p.product_stock ?? 0;
      el('productStockHint').innerHTML =
        stock <= 10
          ? `<span class="badge danger">在庫僅少</span> 現在庫 ${stock}本`
          : `現在庫 ${stock}本`;
    } else {
      el('productStockHint').textContent = '';
    }
    refreshDefaults();
  },
});

async function loadPendingInvoices() {
  const rows = await apiGet('/api/orders/pending-invoices');
  el('invoiceRows').innerHTML = rows.length
    ? rows.map((o) => `<tr>
        <td><input type="checkbox" class="invoice-check" value="${o.id}" style="width:auto"></td>
        <td>${escapeHtml(o.order_no)}</td>
        <td>${escapeHtml(o.delivered_on ?? '')}</td>
        <td>${escapeHtml(o.customer_name)}</td>
        <td>${escapeHtml(o.product_name)}</td>
        <td class="num">${yen(o.total_amount)}</td>
        <td>${escapeHtml(o.invoice_due_note ?? '')}</td>
      </tr>`).join('')
    : '<tr><td colspan="7" class="empty">請求対象の受注はありません</td></tr>';
}

el('invoiceAll').addEventListener('change', () => {
  for (const box of document.querySelectorAll('.invoice-check')) box.checked = el('invoiceAll').checked;
});

el('invoiceSubmit').addEventListener('click', async () => {
  clearMessage('messages');
  const ids = [...document.querySelectorAll('.invoice-check:checked')].map((b) => Number(b.value));
  if (!ids.length) return showMessage('messages', 'error', '対象の受注を選んでください');

  el('invoiceSubmit').disabled = true;
  try {
    const payload = { orderIds: ids };
    if (el('bulkInvoicedOn').value) payload.invoicedOn = el('bulkInvoicedOn').value;
    const r = await apiPost('/api/orders/invoices/bulk', payload);
    showMessage('messages', 'ok',
      `請求日（${r.invoicedOn}）を ${r.updated.length}件に記録しました` +
      (r.skipped.length ? `（${r.skipped.length}件はスキップ）` : ''));
    el('invoiceAll').checked = false;
    await Promise.all([loadOrders(), loadPendingInvoices()]);
  } catch (err) {
    showMessage('messages', 'error', err.message, err.details);
  } finally {
    el('invoiceSubmit').disabled = false;
  }
});

el('orderedOn').value = todayStr();
el('bulkInvoicedOn').value = todayStr();
loadPendingInvoices().catch((err) => showMessage('messages', 'error', err.message));
loadOrders().catch((err) => showMessage('messages', 'error', err.message));
</script>
</body>
</html>
